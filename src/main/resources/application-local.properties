spring.datasource.url=jdbc:postgresql://localhost:5433/gullar
spring.datasource.username=postgres
spring.datasource.password=local_password

spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5433/gullar
spring.flyway.user=postgres
spring.flyway.password=local_password
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:change-this-secret-key-that-is-at-least-32-characters-long}
jwt.expiration=${JWT_EXPIRATION:3600000}